<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Peer Review Process - ICCETACS 2026. Learn about our double-anonymous peer review process, ethical standards, and quality assurance measures.">
    <title>Peer Review Process | ICCETACS 2026</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/sections/submit.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="../js/submit.js" defer></script>
	
</head>
<body>

<main class="peer-review-page"><!-- ================= LOGIN OVERLAY ================= -->
<div class="login-overlay" id="loginOverlay">

  <div class="overlay-backdrop" id="loginClose"></div>

  <div class="overlay-content login-box">

    <!-- CLOSE -->
    <button class="overlay-close" id="loginCloseBtn">&times;</button>

    <!-- HEADER -->
    <div class="login-header">
      <h2>Conference Login</h2>
      <p>Access submission portal</p>
    </div>

    <!-- FORM -->
    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input type="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" required>
      </div>

      <button type="submit" class="btn btn-primary">
        Login
      </button>

      <div class="login-links">
        <a href="#">Forgot Password?</a>
        <a href="#">Register</a>
      </div>

    </form>

  </div>

</div>
</main>
</body>
</html>
